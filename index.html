<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a4fa3">
<meta name="description" content="Cahier de révision du vocabulaire russe, utilisable hors ligne.">
<title>Тетрадь</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* A school exercise book (тетрадь): plain very light cream ground, red margin rule, ink-blue writing; one column. */
:root {
  --paper: #fdfbf6;
  --sheet: #ffffff;
  --grid: rgba(64, 108, 168, 0.10);
  --ink: #1d2433;
  --muted: #5d6676;
  --faint: #8a93a3;
  --line: #d9dfe8;
  --blue: #2a4fa3;
  --blue-soft: #e5ecfa;
  --red: #c93a3a;
  --red-soft: #fbe9e8;
  --green: #23855a;
  --green-soft: #e3f4ec;
  --amber: #a8660b;
  --amber-soft: #fbf0dc;
  --m: #2a63c9; --m-soft: #e2ebfb;
  --f: #c23c6b; --f-soft: #fbe6ee;
  --n: #2f8a5d; --n-soft: #e2f3ea;
  --font-ru: "PT Serif", "Georgia", "Times New Roman", serif;
  --font-ui: "Golos Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-mono: "PT Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11151c; --sheet: #181d26; --grid: rgba(130, 160, 220, 0.07);
  --ink: #e6e9ef; --muted: #a2aab8; --faint: #7c8596; --line: #2a313d;
  --blue: #8fb0ff; --blue-soft: #1f2b45;
  --red: #ff8076; --red-soft: #3a1f22;
  --green: #5fd39b; --green-soft: #17322a;
  --amber: #f0b45a; --amber-soft: #352a17;
  --m: #8ab0ff; --m-soft: #1d2a45; --f: #ff8db5; --f-soft: #3b1d2a; --n: #6fd8a2; --n-soft: #173326;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #11151c; --sheet: #181d26; --grid: rgba(130, 160, 220, 0.07);
  --ink: #e6e9ef; --muted: #a2aab8; --faint: #7c8596; --line: #2a313d;
  --blue: #8fb0ff; --blue-soft: #1f2b45;
  --red: #ff8076; --red-soft: #3a1f22;
  --green: #5fd39b; --green-soft: #17322a;
  --amber: #f0b45a; --amber-soft: #352a17;
  --m: #8ab0ff; --m-soft: #1d2a45; --f: #ff8db5; --f-soft: #3b1d2a; --n: #6fd8a2; --n-soft: #173326;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app { max-width: 600px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 18px 10px; }
.brand { font-family: var(--font-ru); font-size: 22px; font-weight: 700; color: var(--blue); letter-spacing: 0.01em; }
.brand small { font-family: var(--font-ui); font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.sync { font-size: 12px; color: var(--faint); text-align: right; max-width: 45%; }
.sync.warn { color: var(--amber); }

nav.tabs { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; }
nav.tabs .in { display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { background: none; border: 0; padding: 10px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 500; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--blue); }

/* sheet = page of the notebook with red margin */
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); position: relative; padding: 18px 18px 18px 30px; }
.sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 18px; width: 1px; background: var(--red); opacity: 0.55; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
h2 { font-size: 18px; margin: 0; font-weight: 600; text-wrap: balance; }
h3 { font-size: 12px; margin: 0; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 10px 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--sheet); font-weight: 600; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--blue); }
.btn.danger { color: var(--red); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: default; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.seg button { flex: 1; border: 0; background: none; padding: 10px 6px; font-size: 14px; font-weight: 500; color: var(--muted); min-height: 44px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); font-weight: 600; }
input[type="text"], input[type="search"], input[type="number"], textarea, select {
  width: 100%; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 10px 12px; min-height: 44px; }
textarea { min-height: 150px; resize: vertical; font-family: var(--font-ui); }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }

.stepper { display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.stepper button { border: 0; background: none; width: 44px; height: 44px; font-size: 20px; color: var(--blue); }
.stepper .cnt-in { border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 0; }

/* badges */
.g { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
.g.m { color: var(--m); background: var(--m-soft); }
.g.f { color: var(--f); background: var(--f-soft); }
.g.n { color: var(--n); background: var(--n-soft); }
.g.pl, .g.x { color: var(--muted); background: var(--paper); border: 1px solid var(--line); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); }
.tag.irr { color: var(--red); background: var(--red-soft); border-color: transparent; }
.tag.asp { color: var(--blue); background: var(--blue-soft); border-color: transparent; }

/* review */
.prompt-card { text-align: center; padding: 26px 18px 22px 30px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.prompt-meta { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.prompt { font-size: 30px; line-height: 1.2; font-weight: 600; text-wrap: balance; overflow-wrap: anywhere; }
.prompt.ru { font-family: var(--font-ru); font-weight: 700; font-size: 36px; }
.prompt .par { color: var(--faint); font-weight: 400; font-size: 0.62em; white-space: nowrap; }
.formq { font-family: var(--font-ru); font-size: 22px; }
.answer-in { font-size: 22px; text-align: center; font-family: var(--font-ru); }
.answer-in.fr { font-family: var(--font-ui); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--blue); width: 0; transition: width .25s; }
.verdict { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; }
.verdict b { display: block; font-size: 16px; }
.verdict.ok { background: var(--green-soft); color: var(--green); }
.verdict.near { background: var(--amber-soft); color: var(--amber); }
.verdict.bad { background: var(--red-soft); color: var(--red); }
.verdict .why { color: var(--ink); font-size: 14px; }
.diff { font-family: var(--font-ru); font-size: 19px; }
.diff s { color: var(--red); text-decoration-thickness: 2px; }
.diff ins { color: var(--green); text-decoration: none; border-bottom: 2px solid var(--green); }

.word-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ru-big { font-family: var(--font-ru); font-size: 34px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.speak { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); display: inline-flex; align-items: center; justify-content: center; color: var(--blue); flex: 0 0 auto; }
.speak svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fr-line { font-size: 17px; }
.fr-line .alt { color: var(--muted); font-size: 14px; }
.notes { display: flex; flex-direction: column; gap: 8px; }
.note { border-left: 3px solid var(--red); padding: 4px 0 4px 10px; font-size: 14px; }
.note.rule { border-left-color: var(--blue); }
.conj { width: 100%; border-collapse: collapse; font-size: 15px; }
.conj td { padding: 5px 6px; border-bottom: 1px dashed var(--line); }
.conj td:first-child { color: var(--muted); width: 34%; font-size: 13px; }
.conj td.ru { font-family: var(--font-ru); font-size: 17px; }
.conj tr.hl td.ru { color: var(--red); font-weight: 700; }
.table-wrap { overflow-x: auto; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-family: var(--font-ru); font-size: 16px; }

/* lists */
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 11px 2px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.item .ru { font-family: var(--font-ru); font-size: 18px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.item .fr { color: var(--muted); font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.item .side { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.meter { display: inline-flex; gap: 2px; }
.meter i { width: 6px; height: 14px; border-radius: 2px; background: var(--line); }
.meter.l1 i:nth-child(-n+1), .meter.l2 i:nth-child(-n+2), .meter.l3 i:nth-child(-n+3), .meter.l4 i:nth-child(-n+4), .meter.l5 i:nth-child(-n+5) { background: var(--blue); }
.meter.l1 i:nth-child(1) { background: var(--red); }
.add-btn { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); color: var(--blue); font-size: 22px; line-height: 1; }
.add-btn.done { color: var(--green); border-color: transparent; background: var(--green-soft); font-size: 16px; }

.empty { text-align: left; }
.empty .ru-hand { font-family: var(--font-ru); font-style: italic; font-size: 26px; color: var(--blue); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 22px; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.notice { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px); width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--sheet); padding: 10px 14px; border-radius: 8px; font-size: 14px; pointer-events: none; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18); }
.arow { min-height: 64px; }
.arow.todo { background: var(--amber-soft); border-left: 4px solid var(--amber); padding-left: 8px; border-radius: 6px; }
.arow.todo > :last-child { grid-column: 2 / 4; flex-direction: row !important; gap: 10px !important; align-items: center !important; text-align: left !important; }
.arow [data-sug] { display: block; white-space: normal; }
.done-box { border-left: 4px solid var(--green); padding-left: 12px; }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: baseline; font-size: 13px; }
.legend dd { margin: 0; color: var(--muted); }
.cnt-in { width: 72px; min-height: 44px; border: 0; text-align: center; font-family: var(--font-mono); font-size: 17px; background: none; -moz-appearance: textfield; }
.cnt-in::-webkit-outer-spin-button, .cnt-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.switch { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.switch input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--blue); flex: 0 0 auto; }
.switch .t { font-weight: 500; }
.switch .d { font-size: 13px; color: var(--muted); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.ok { background: var(--green); } .status-dot.claude { background: var(--blue); } .status-dot.ko { background: var(--red); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } .progress i { transition: none; } }
details summary { cursor: pointer; color: var(--blue); font-weight: 500; padding: 6px 0; }
.credit { font-size: 12px; color: var(--faint); }
.credit a { color: var(--muted); }

.btn.small { min-height: 36px; padding: 6px 10px; font-size: 13px; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 16px; }
.steps li { display: flex; flex-direction: column; gap: 6px; }
.steps li.later { opacity: 0.7; }
.step-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tips { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.filebtn { cursor: pointer; }
.thumb { border: 1px solid var(--line); border-radius: 8px; padding: 0; background: var(--paper); width: 84px; height: 110px; overflow: hidden; flex: 0 0 auto; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--paper); overflow: auto; padding: calc(env(safe-area-inset-top, 0px) + 8px) max(8px, env(safe-area-inset-right, 0px)) 24px max(8px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
.overlay img { width: 100%; max-width: none; }
.vrow.todo { background: var(--amber-soft); border-left: 4px solid var(--amber); border-radius: 6px; padding: 10px 10px 10px 12px; }
.vrow.done { padding: 8px 2px; }
.ru-mid { font-family: var(--font-ru); font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
.item.dropped { opacity: 0.45; }
.item.dropped .ru { text-decoration: line-through; }
.grade-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.grade-row .btn { min-height: 52px; }
.chip .cnt { font-family: var(--font-mono); font-size: 12px; opacity: 0.75; margin-left: 2px; }
.send-card { border-color: var(--blue); }
.switch.off { opacity: 0.6; }
.ru-in { font-family: var(--font-ru); font-size: 16px; }
.facts dd.frdd { font-family: var(--font-ui); font-size: 14px; }
.verdict { flex-direction: column; gap: 4px; }
.done-box { border-left: 4px solid var(--green); }

.btn.choice { justify-content: flex-start; text-align: left; white-space: normal; line-height: 1.35; padding: 8px 10px; }

.preview { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); max-height: 60vh; display: flex; justify-content: center; }
.preview img { max-height: 60vh; width: auto; max-width: 100%; display: block; }

.readfr { font-size: 16px; font-weight: 600; }
.opt { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
.opt input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--blue); flex: 0 0 auto; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top"><div class="brand">Тетрадь<small>vocabulaire russe</small></div><div class="sync" id="sync">Chargement…</div></header>
  <nav class="tabs" aria-label="Sections"><div class="in">
    <button type="button" data-tab="review" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 10h6M8 14h4"/></svg>Réviser</button>
    <button type="button" data-tab="consult"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>Consulter</button>
    <button type="button" data-tab="receive"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>Recevoir</button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>
  </div></nav>
  <div id="notice" class="notice" role="status" hidden></div>
  <main id="view" class="stack" aria-live="polite"><div class="sheet"><p class="muted">Ouverture du cahier…</p></div></main>
</div>
<script>
(() => {
'use strict';
// ===================================================================== shared core (Claude page + installed app)
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
const now = () => Date.now();
const ACUTE = /́/g;
const plain = s => String(s || '').replace(ACUTE, '').normalize('NFC');
const isCyr = s => /[Ѐ-ӿ]/.test(String(s || ''));
const lsGet = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
function hash36(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); }
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) { cur[0] = i; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); [prev, cur] = [cur, prev]; }
  return prev[n];
}
let noticeTimer;
function toast(msg, ms = 3500) {
  const t = $('#notice'); if (!t) return;
  t.textContent = msg; t.hidden = false;
  clearTimeout(noticeTimer); noticeTimer = setTimeout(() => { t.hidden = true; }, ms);
}
function toTop() { try { window.scrollTo(0, 0); } catch (e) {} }
function showError(err) {
  const msg = (err && (err.message || (err.reason && err.reason.message) || err.reason)) || String(err);
  toast('Erreur : ' + String(msg).slice(0, 140) + '. Fais une capture d’écran pour Claude.', 9000);

function irregulars(w) {

    if (d.f.plGen) forms.push({ f: d.f.plGen, label: 'génitif pluriel', topic: 'genitif', tl: 'génitif pluriel' });
  }

    </section>
    ${w.seen ? `<section class="sheet stack"><h3>Ma progression</h3><dl class="facts"><dt>Français → russe</dt><dd class="frdd">${lvl('fr')}</dd><dt>Russe → français</dt><dd class="frdd">${lvl('ru')}</dd></dl>
      <div id="rz"><button class="btn wide" type="button" id="reset">Remettre à zéro</button></div></section>` : '<p class="small muted">Ce mot est dans le lexique du livre mais dans aucune de tes pages de leçon : il n’est pas encore révisé.</p>'}
    <p class="small muted">Grammaire : ${d ? 'dictionnaires OpenRussian et OpenCorpora' : 'aucune, mot absent des dictionnaires'}. Traduction : ${w.trSrc === 'livre' ? 'ton livre' : 'dictionnaire WikDict'}.</p>`;
  $('[data-back]', v).onclick = () => { A.consult.open = null; render(); };
  const rs = $('#reset'); if (rs) rs.onclick = () => {
    $('#rz').innerHTML = '<div class="row"><span class="small grow">Effacer la progression de ce mot ?</span><button class="btn" type="button" id="no">Non</button><button class="btn danger" type="button" id="yes">Effacer</button></div>';
    $('#no').onclick = render; $('#yes').onclick = () => { delete A.cards[w.id]; save(); toast('Progression effacée'); render(); };
  };
}

// ---------------------------------------------------------------- receive
async function receive(text) {
  const d = decodeTransfer(text);
  if (!d) { toast('Ce texte ne vient pas de ta page Claude, ou il est incomplet. Recopie-le là-bas.', 6000); return false; }
  const before = new Set(seenWords().map(w => w.id));
  const got = [];
  for (const p of d.pages) { if (!p || !p.key || !Array.isArray(p.items)) continue; const old = A.pages.get(p.key); if (!old || (old.at || 0) <= (p.at || 0)) { A.pages.set(p.key, p); got.push(p); } }
  save(); await rebuild();
  const fresh = seenWords().filter(w => !before.has(w.id)).length;
  A.lastReceived = { pages: got.map(pageLabel), fresh, total: got.reduce((n, p) => n + p.items.length, 0) };
  status(); render(); return true;
}
function renderReceive(v) {
  const r = A.lastReceived;
  const pages = [...A.pages.values()].sort((a, b) => (a.kind === b.kind ? (parseInt(a.page) || 0) - (parseInt(b.page) || 0) : a.kind === 'lesson' ? -1 : 1));
  v.innerHTML = `${r ? `<section class="sheet stack done-box"><h2>Reçu : ${esc(r.pages.join(', ') || 'rien de nouveau')}</h2><p>${plural(r.fresh, 'nouveau mot', 'nouveaux mots')} à réviser.</p><button class="btn primary wide" type="button" data-go="review">Réviser</button></section>` : ''}
    <section class="sheet stack"><h2>Recevoir des pages</h2>
      <p class="small">Les photos se lisent sur ta page Claude. Là-bas, après avoir enregistré une page, touche « Copier pour l’appli Тетрадь », puis reviens ici.</p>
      <button class="btn primary wide" type="button" id="paste">Coller</button>
      <div id="pastebox" class="stack" hidden><p class="small">Ton téléphone ne laisse pas l’appli lire ce que tu as copié. Appuie longuement dans la case, puis touche Coller.</p><textarea id="pastetext" aria-label="Texte copié sur la page Claude" style="min-height:90px;font-size:12px"></textarea></div>
      <label class="btn wide filebtn"><input type="file" id="pfile" accept=".json,application/json,text/plain" hidden>Choisir un fichier</label>
      <a class="btn ghost wide" href="${CLAUDE_PAGE}" target="_blank" rel="noopener">Ouvrir ma page Claude</a></section>
    ${pages.length ? `<section class="sheet stack"><h3>Pages dans l’appli</h3><div class="list">${pages.map(p => `<div class="item"><span class="stack" style="gap:0"><b>${esc(pageLabel(p))}</b><span class="small muted">${plural(p.items.length, 'mot')} · lue le ${dateLabel(p.at)}</span></span><span class="side"><button class="btn small ghost danger" type="button" data-del="${esc(p.key)}">Supprimer</button></span></div>`).join('')}</div></section>` : ''}`;
  const go = $('[data-go]', v); if (go) go.onclick = () => { A.lastReceived = null; setTab('review'); };
  const box = $('#pastebox'), ta = $('#pastetext');
  ta.oninput = () => { const t = ta.value.trim(); if (t.endsWith('}')) receive(t); };
  $('#paste').onclick = async () => { let t = ''; try { t = await navigator.clipboard.readText(); } catch (e) {} if (t) receive(t); else { box.hidden = false; ta.focus(); } };
  $('#pfile').onchange = async e => { const f = e.target.files && e.target.files[0]; if (f) receive(await f.text()); };
  $$('[data-del]', v).forEach(b => b.onclick = () => {
    const key = b.dataset.del; const p = A.pages.get(key); const side = b.closest('.side');
    side.innerHTML = `<button class="btn small" type="button" data-no>Non</button><button class="btn small danger" type="button" data-yes>Supprimer</button>`;
    side.querySelector('[data-no]').onclick = render;
    side.querySelector('[data-yes]').onclick = async () => { A.pages.delete(key); save(); await rebuild(); status(); toast(pageLabel(p) + ' supprimée. La progression de ses mots est gardée.'); render(); };
  });
}

// ---------------------------------------------------------------- settings
function renderSettings(v) {
  const st = A.settings; Voice.load();
  const detected = new Map(); for (const p of A.pages.values()) if (p.kind === 'lesson') (p.topics || []).forEach(t => { if (!detected.has(t)) detected.set(t, []); detected.get(t).push(p.page); });
  const seen = seenTopics();
  v.innerHTML = `<section class="sheet stack"><h2>Grammaire vue</h2>
      <p class="small muted">Déduite de tes pages de leçon. Elle décide si une forme irrégulière signalée dans le lexique est interrogée ou seulement rappelée. Touche un point pour le corriger.</p>
      <div class="chips">${Object.entries(TOPICS).filter(([k]) => k !== 'autre').map(([k, l]) => `<button type="button" class="chip" data-topic="${k}" aria-pressed="${seen.has(k)}">${esc(l)}${detected.has(k) ? ` <span class="cnt">p. ${esc(detected.get(k).join(', '))}</span>` : ''}</button>`).join('')}</div></section>
    <section class="sheet stack"><h2>Audio</h2>
      <label class="switch"><input type="checkbox" id="auto" ${st.autoSpeak ? 'checked' : ''}><span class="stack" style="gap:2px"><span class="t">Lire la réponse à voix haute</span><span class="d">Après chaque question.</span></span></label>
      <label class="field">Vitesse<select id="rate">${[[0.7, 'lente'], [0.9, 'normale'], [1.1, 'rapide']].map(([r, l]) => `<option value="${r}" ${st.rate === r ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      ${Voice.voices.length > 1 ? `<label class="field">Voix<select id="voice">${Voice.voices.map(x => `<option ${x.name === st.voice ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>` : ''}
      <button class="btn" type="button" data-speak="Здравствуйте">Tester la voix</button></section>
    <section class="sheet stack"><h2>Sauvegarde</h2>
      <p class="small muted">Tes pages et ta progression restent sur ce téléphone. Exporte de temps en temps un fichier de sauvegarde.</p>
      <button class="btn wide" type="button" id="exp">Exporter une sauvegarde</button>
      <label class="btn wide filebtn"><input type="file" id="imp" accept=".json,application/json" hidden>Restaurer une sauvegarde</label>
      <div id="wipez"><button class="btn danger wide" type="button" id="wipe">Tout effacer</button></div></section>
    <p class="credit">Grammaire : OpenRussian (CC BY-SA 4.0) et OpenCorpora. Traductions de secours : WikDict, tiré du Wiktionnaire (CC BY-SA 3.0).</p>`;
  $$('[data-topic]', v).forEach(b => b.onclick = () => {
    const k = b.dataset.topic; const on = seen.has(k);
    st.topicsOn = st.topicsOn.filter(x => x !== k); st.topicsOff = st.topicsOff.filter(x => x !== k);
    if (on && detected.has(k)) st.topicsOff.push(k); else if (!on && !detected.has(k)) st.topicsOn.push(k);
    save(); render();
  });
  $('#auto').onchange = e => { st.autoSpeak = e.target.checked; save(); };
  $('#rate').onchange = e => { st.rate = +e.target.value; Voice.rate = st.rate; save(); };
  const vo = $('#voice'); if (vo) vo.onchange = e => { st.voice = e.target.value; Voice.voice = st.voice; save(); };
  $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify({ app: 'tetrad', v: 2, kind: 'backup', at: now(), pages: [...A.pages.values()], cards: A.cards, settings: A.settings })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tetrad-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
  };
  $('#imp').onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (d.app !== 'tetrad' || d.kind !== 'backup') throw new Error('format');
      A.pages = new Map((d.pages || []).map(p => [p.key, p])); A.cards = d.cards || {}; A.settings = Object.assign(structuredClone(DEFAULTS), d.settings || {}); save(); await rebuild(); status(); toast('Sauvegarde restaurée'); render();
    } catch (err) { toast('Ce fichier n’est pas une sauvegarde de l’appli.'); }
  };
  $('#wipe').onclick = () => {
    $('#wipez').innerHTML = '<div class="row"><span class="small grow">Effacer toutes les pages et toute la progression ?</span><button class="btn" type="button" id="no">Non</button><button class="btn danger" type="button" id="yes">Tout effacer</button></div>';
    $('#no').onclick = render; $('#yes').onclick = async () => { A.pages = new Map(); A.cards = {}; save(); await rebuild(); status(); render(); };
  };
}

(async () => {
  try {
    load();
    $$('nav.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
    await rebuild();
    status(); render();
  } catch (e) { showError(e); }
})();

})();
</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
